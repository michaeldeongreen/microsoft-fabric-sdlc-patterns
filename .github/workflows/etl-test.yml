# Manual recovery only. Deploy callers invoke ETL through needs in the same
# revision, avoiding workflow_run's default-branch coupling and duplicate runs.

name: ETL - Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/test' && 'fabric-deploy-test' || format('fabric-skipped-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false

jobs:
  run-etl:
    name: Run ETL
    if: github.ref == 'refs/heads/test'
    uses: ./.github/workflows/reusable-fabric-etl.yml
    with:
      environment: Test
      item_name: Patterns_Load_Validate_And_Refresh
      item_type: DataPipeline
      job_type: Pipeline
      run_label: Test-${{ github.run_id }}
    secrets: inherit
