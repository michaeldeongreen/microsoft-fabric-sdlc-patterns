# Reusable workflow: Deploy supported Fabric items via fabric-cicd with bulk
# publish requested (experimental).
#
# Third deployment path alongside reusable-deploy-fabric-cicd.yml (standard
# fabric-cicd) and reusable-deploy-bulk.yml (raw REST bulk). Selected at the
# orchestrator level via the DEPLOY_METHOD repository variable
# (DEPLOY_METHOD=fabric-cicd-bulk).
#
# Called by: deploy-test-fabric-cicd-bulk.yml, deploy-prod-fabric-cicd-bulk.yml
#
# What it demonstrates:
#   This path enables fabric-cicd's experimental bulk publish
#   (enable_experimental_features + enable_bulk_publish) and runs the same
#   two-phase deployment as the standard path. Because data/fabric/parameter.yml
#   is built on $items/$workspace dynamic variables, fabric-cicd ALWAYS falls
#   back to standard per-item publish here. scripts/deploy_fabric_cicd_bulk.py
#   surfaces that outcome; watch the log for the fabric-cicd warning
#   "Falling back to standard deployment. Reason: parameter file contains
#   dynamic variables ($workspace/$items)..." and the script's own summary.
#
# Prerequisites:
#   - GitHub Environment secrets: AZURE_TENANT_ID, AZURE_CLIENT_ID,
#     AZURE_CLIENT_SECRET, FABRIC_WORKSPACE_ID
#   - Service principal must have Contributor (or higher) role on the target workspace
#   - Fabric Admin must enable "Service principals can use Fabric APIs"
#   - parameter.yml in repository_directory for environment-specific replacements
#
# Requires fabric-cicd >= 1.2.0 (bulk publish was added in 1.2.0).

name: "Reusable: Deploy via fabric-cicd Bulk"

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (Test, Prod)"
        required: true
        type: string
      repository_directory:
        description: "Path to the Fabric item definitions"
        required: false
        type: string
        default: "data/fabric"
      item_type_in_scope:
        description: "JSON array of item types to deploy (e.g., '[\"Notebook\", \"Lakehouse\"]'). Deploys all if omitted."
        required: false
        type: string
        default: ""
      fail_if_bulk_used:
        description: "Fail the job if bulk publish is actually used (i.e., the expected fallback did not happen). Off by default."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy via fabric-cicd Bulk (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "fabric-cicd>=1.2.0,<2.0.0" azure-identity

      # fabric-cicd reads parameter.yml from the repository_directory root and
      # applies environment-specific find_replace rules. With bulk publish
      # requested but $items/$workspace variables present, it falls back to
      # standard per-item publish; the script logs and proves that outcome.
      - name: Deploy with fabric-cicd (bulk requested)
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
          REPOSITORY_DIRECTORY: ${{ inputs.repository_directory }}
          ENVIRONMENT: ${{ inputs.environment }}
          ITEM_TYPE_IN_SCOPE: ${{ inputs.item_type_in_scope }}
          FAIL_IF_BULK_USED: ${{ inputs.fail_if_bulk_used }}
        run: python scripts/deploy_fabric_cicd_bulk.py
