# Reusable workflow: Strict SDK bulk with isolated client-side plan ordering.
#
# Third deployment path alongside reusable-deploy-fabric-cicd.yml (standard
# fabric-cicd) and reusable-deploy-bulk.yml (raw REST bulk). Selected at the
# orchestrator level via the DEPLOY_METHOD repository variable
# (DEPLOY_METHOD=fabric-cicd-bulk).
#
# Called by: deploy-test-fabric-cicd-bulk.yml, deploy-prod-fabric-cicd-bulk.yml
#
# The repository-owned bulk adapter batches independent ready plan groups.
# fabric-cicd owns parameterization; fallback and incomplete success fail the job.
# This is not native Deployment Plan execution or Before/After action support.
#
# Prerequisites:
#   - GitHub Environment secrets: AZURE_TENANT_ID, AZURE_CLIENT_ID,
#     AZURE_CLIENT_SECRET, FABRIC_WORKSPACE_ID
#   - Service principal must have Contributor (or higher) role on the target workspace
#   - Fabric Admin must enable "Service principals can use Fabric APIs"
#   - parameter.yml in repository_directory for environment-specific replacements
#   - DEPLOYMENT_PLAN_PATH repository variable pointing to the committed plan
#
# Requires a released fabric-cicd >= 1.4.0, < 1.5.0; bulk remains experimental.

name: "Reusable: Deploy via fabric-cicd Bulk"

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (Test, Prod)"
        required: true
        type: string
      deployment_plan_path:
        description: "Checkout-relative path to the committed ordering-only plan.yml"
        required: true
        type: string
      repository_directory:
        description: "Path to the Fabric item definitions"
        required: false
        type: string
        default: "data/fabric"
      item_type_in_scope:
        description: "Required nonempty JSON array of bulk-eligible item types"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy via fabric-cicd Bulk (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      REPOSITORY_DIRECTORY: ${{ inputs.repository_directory }}
      DEPLOYMENT_PLAN_PATH: ${{ inputs.deployment_plan_path }}
      ENVIRONMENT: ${{ inputs.environment }}
      ITEM_TYPE_IN_SCOPE: ${{ inputs.item_type_in_scope }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "fabric-cicd>=1.4.0,<1.5.0" "azure-identity>=1.15" "PyYAML>=6.0"

      - name: Preview and validate the bulk deployment schedule
        run: python scripts/deploy_fabric_cicd_bulk.py --dry-run

      - name: Deploy with strict fabric-cicd bulk in plan order
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
        run: python scripts/deploy_fabric_cicd_bulk.py
