# Triggers ETL jobs in the Prod workspace after a successful deployment.
#
# Same pattern as etl-test.yml but targeting the prod environment.
# The `Prod` GitHub Environment protection rules also apply to this workflow's
# reusable template job, providing an additional approval gate if configured.
#
# The notebook is resolved by name at runtime — no item ID needed.

name: ETL - Prod

on:
  workflow_run:
    # Triggered by either deployment workflow. The DEPLOY_METHOD repository
    # variable ensures only one of them actually runs per push, so ETL fires once.
    # The success conclusion gate below skips ETL when a deploy was skipped.
    workflows: ["Deploy to Prod (fabric-cicd)", "Deploy to Prod (Bulk API)"]
    types: [completed]
  # Manual trigger so operators can re-run the ETL without having to fake a
  # deploy. The Prod GitHub Environment protection rules still apply to the
  # reusable workflow's job, so any approval gates remain in effect.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-etl:
    name: Run ETL
    # Run when triggered manually, OR when the upstream deploy workflow succeeded.
    # workflow_run-triggered runs whose deploy was skipped/failed should not run.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/reusable-fabric-etl.yml
    with:
      environment: Prod
      item_name: Import_Patterns_Data
    secrets: inherit
