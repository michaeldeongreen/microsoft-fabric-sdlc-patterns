  <rect x="835" y="150" width="210" height="28" rx="4" fill="#e8f0fe" stroke="#0078d4" stroke-width="1"/>
  <text x="845" y="169" font-size="9" fill="#0078d4"><tspan font-weight="bold">1.</tspan> Crear/reusar par WI; guardar IDs</text>

