# Orchestrator workflow for deploying Fabric items to the Prod workspace via
# fabric-cicd strict plan-driven bulk (experimental).
#
# Third deploy method alongside deploy-prod.yml (standard fabric-cicd) and
# deploy-prod-bulk.yml (raw REST bulk). All fire on push to main; only one runs
# based on the DEPLOY_METHOD repository variable:
#   - DEPLOY_METHOD = 'fabric-cicd-bulk'  → this workflow runs
#   - DEPLOY_METHOD = 'bulk'              → deploy-prod-bulk.yml runs
#   - DEPLOY_METHOD = 'fabric-cicd' or '' → deploy-prod.yml runs
#   - DEPLOY_METHOD = 'fabric-cicd-plan'  → deploy-prod-fabric-cicd-plan.yml runs
#   - any other value                     → all skip (safe default)
#
# Requires DEPLOYMENT_PLAN_PATH. Independent ready groups are combined;
# unexpected standard fallback or failed item outcomes fail deployment.
#
# The `Prod` GitHub Environment should have protection rules configured
# (e.g., required reviewers, branch policy restricting to main only).
#
# The dependent ETL job uses the same revision after successful deployment.

name: Deploy and Run Pipeline - Prod (fabric-cicd Bulk)

on:
  push:
    branches: [main]
    paths:
      - "data/fabric/**"
      - "data/fabric-dev-bindings.json"
      - "deployment-plans/**"
      - ".github/workflows/**"
      - "scripts/deploy_fabric_cicd_bulk.py"
      - "scripts/deployment_plan_bulk.py"
      - "scripts/fabric_connections.py"
      - "scripts/prepare_fabric_workspace.py"
      - "scripts/pipeline_bindings.py"
      - "scripts/run_fabric_etl.py"
      - "requirements-dev.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && vars.DEPLOY_METHOD == 'fabric-cicd-bulk' && 'fabric-deploy-prod' || format('fabric-skipped-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy-fabric-cicd-bulk:
    name: Deploy via fabric-cicd Bulk
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_METHOD == 'fabric-cicd-bulk'
    uses: ./.github/workflows/reusable-deploy-fabric-cicd-bulk.yml
    with:
      environment: Prod
      deployment_plan_path: ${{ vars.DEPLOYMENT_PLAN_PATH }}
      item_type_in_scope: '["Lakehouse", "Ontology", "VariableLibrary", "Notebook", "SemanticModel", "Report", "DataAgent", "DataPipeline"]'
    secrets: inherit

  run-etl:
    name: Load, validate, and refresh
    needs: deploy-fabric-cicd-bulk
    uses: ./.github/workflows/reusable-fabric-etl.yml
    with:
      environment: Prod
      item_name: Patterns_Load_Validate_And_Refresh
      item_type: DataPipeline
      job_type: Pipeline
      run_label: Prod-${{ github.run_id }}
    secrets: inherit
