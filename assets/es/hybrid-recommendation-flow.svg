  <!-- ==================== OPTIONAL PUBLISHER EXTENSION (conceptual) ==================== -->
  <rect x="545" y="385" width="525" height="68" rx="6" fill="none" stroke="#6f42c1" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="807" y="408" text-anchor="middle" font-size="11" fill="#6f42c1" font-weight="bold">Publicador opcional con Pipelines de despliegue nativos</text>
  <text x="807" y="425" text-anchor="middle" font-size="9" fill="#6f42c1">No implementado; verificar elemento/subtipo e identidad antes de usarlo</text>
  <text x="807" y="442" text-anchor="middle" font-size="9" fill="#6f42c1">Requiere bloqueo compartido del workspace y coordinación de dependencias</text>

  <!-- ==================== CONFIGURATION ==================== -->
  <rect x="30" y="460" width="520" height="120" rx="8" fill="#e8f0fe" stroke="#0078d4" stroke-width="1"/>
  <text x="290" y="485" text-anchor="middle" font-size="13" font-weight="bold" fill="#0078d4">Estrategia de configuración</text>

  <rect x="45" y="498" width="240" height="70" rx="5" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="165" y="518" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Variable Libraries (en ejecución)</text>
  <text x="165" y="534" text-anchor="middle" font-size="9" fill="#555">El conjunto activo aporta los IDs de destino</text>
  <text x="165" y="548" text-anchor="middle" font-size="9" fill="#555">y el mínimo de validación (Integer, base 5).</text>
  <text x="165" y="562" text-anchor="middle" font-size="9" fill="#555">run_label es una entrada aparte.</text>

  <rect x="300" y="498" width="240" height="70" rx="5" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="420" y="518" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">parameter.yml (en el despliegue)</text>
  <text x="420" y="534" text-anchor="middle" font-size="9" fill="#555">Reescribe IDs físicos de workspace y elementos;</text>
  <text x="420" y="548" text-anchor="middle" font-size="9" fill="#555">$ENV: selecciona los GUID de conexión.</text>
  <text x="420" y="562" text-anchor="middle" font-size="9" fill="#555">El lanzamiento crea/reutiliza el par de Test/Prod.</text>

  <!-- ==================== REPOSITORY DEFAULT ==================== -->
  <rect x="580" y="460" width="490" height="120" rx="8" fill="#e8f5e9" stroke="#28a745" stroke-width="1"/>
  <text x="825" y="485" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e7e34">Configuración predeterminada del repositorio</text>
  <text x="825" y="510" text-anchor="middle" font-size="10" fill="#333">Las definiciones versionadas se publican con</text>
  <text x="825" y="528" text-anchor="middle" font-size="10" fill="#333">fabric-cicd no masivo; sin Pipelines de despliegue nativos.</text>
  <text x="825" y="552" text-anchor="middle" font-size="10" fill="#28a745" font-weight="bold">→ Un trabajo de despliegue por entorno</text>
  <text x="825" y="570" text-anchor="middle" font-size="10" fill="#28a745" font-weight="bold">→ Extensiones de publicación opcionales no implementadas</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="30" y="610" width="1040" height="95" rx="8" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="550" y="632" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Leyenda</text>

  <rect x="50" y="645" width="14" height="14" rx="2" fill="#e8f0fe" stroke="#0078d4" stroke-width="1"/>
  <text x="72" y="657" font-size="10" fill="#333">Despliegue no masivo con fabric-cicd</text>

  <rect x="300" y="645" width="14" height="14" rx="2" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="322" y="657" font-size="10" fill="#333">Paso del flujo de trabajo o de la carga</text>

  <rect x="550" y="645" width="14" height="14" rx="2" fill="none" stroke="#6f42c1" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="572" y="657" font-size="10" fill="#333">Publicador nativo opcional (verificar compatibilidad; no implementado)</text>

  <text x="50" y="681" font-size="10" fill="#555">Test predeterminado verificado: conexiones, publicación y DataPipeline de la misma revisión.</text>
  <text x="50" y="697" font-size="10" fill="#555">Prod, los publicadores alternativos y el ciclo Branch Out completo actual siguen sin verificarse.</text>

