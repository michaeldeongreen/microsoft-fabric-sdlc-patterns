# Triggers ETL jobs in the Prod workspace after a successful deployment.
#
# Same pattern as etl-test.yml but targeting the prod environment.
# The `Prod` GitHub Environment protection rules also apply to this workflow's
# reusable template job, providing an additional approval gate if configured.
#
# The notebook is resolved by name at runtime — no item ID needed.

name: ETL - Prod

on:
  workflow_run:
    # Triggered by either deployment workflow. The DEPLOY_METHOD repository
    # variable ensures only one of them actually runs per push, so ETL fires once.
    # The success conclusion gate below skips ETL when a deploy was skipped.
    workflows: ["Deploy to Prod", "Deploy to Prod (Bulk API)"]
    types: [completed]

permissions:
  contents: read

jobs:
  run-etl:
    name: Run ETL
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/reusable-fabric-etl.yml
    with:
      environment: Prod
      item_name: Import_Patterns_Data
    secrets: inherit
