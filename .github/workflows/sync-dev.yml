# Dev is an integration workspace; author changes in feature workspaces.
# Source-authoritative policy may restore the managed model's definition,
# never delete data/items or commit workspace changes to Git.
name: Sync Dev and Run Pipeline

on:
  push:
    branches: [dev]
    paths:
      - "data/fabric/**"
      - "data/fabric-dev-bindings.json"
      - "scripts/sync_fabric_git.py"
      - "scripts/fabric_connections.py"
      - "scripts/pipeline_bindings.py"
      - "scripts/prepare_fabric_workspace.py"
      - "scripts/run_fabric_etl.py"
      - ".github/workflows/sync-dev.yml"
      - ".github/workflows/reusable-fabric-etl.yml"
  workflow_dispatch:
    inputs:
      rotate_git_token:
        description: "Rotate the managed GitHub connection using the approved PAT secret"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/dev' && 'fabric-deploy-dev' || format('fabric-skipped-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false

jobs:
  sync:
    name: Verify source and synchronize Git-connected Dev
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Dev
    env:
      FABRIC_CONNECTION_MODE: ${{ vars.FABRIC_CONNECTION_MODE || 'auto' }}
      FABRIC_RUNTIME_AUTHENTICATION: ${{ vars.FABRIC_RUNTIME_AUTHENTICATION || 'ServicePrincipal' }}
      GIT_SYNC_POLICY: ${{ vars.DEV_GIT_SYNC_POLICY || 'source-authoritative' }}
      REPOSITORY_DIRECTORY: data/fabric
    steps:
      - name: Checkout reviewed Dev revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install authentication dependency
        run: pip install "azure-identity>=1.15" "PyYAML>=6.0"

      - name: Validate and sync Dev from Git
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
          FABRIC_GIT_REPOSITORY: ${{ github.repository }}
          FABRIC_GIT_BRANCH: dev
          FABRIC_GIT_COMMIT: ${{ github.sha }}
          FABRIC_GIT_CONNECTION_ID: ${{ vars.FABRIC_GIT_CONNECTION_ID }}
          FABRIC_GITHUB_TOKEN: ${{ secrets.FABRIC_GITHUB_TOKEN }}
          ROTATE_GIT_TOKEN: ${{ inputs.rotate_git_token }}
        run: |
          args=()
          if [ "$ROTATE_GIT_TOKEN" = "true" ]; then
            args+=(--rotate-git-token)
          fi
          python scripts/sync_fabric_git.py --policy "$GIT_SYNC_POLICY" "${args[@]}"

  run-etl:
    name: Load, validate, and refresh Dev
    needs: sync
    uses: ./.github/workflows/reusable-fabric-etl.yml
    with:
      environment: Dev
      item_name: Patterns_Load_Validate_And_Refresh
      item_type: DataPipeline
      job_type: Pipeline
      run_label: Dev-${{ github.run_id }}
    secrets: inherit
