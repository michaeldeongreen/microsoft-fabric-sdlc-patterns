# Orchestrator workflow for deploying Fabric items to the Prod workspace via the Bulk Import API.
#
# Alternative to deploy-prod.yml. All fire on push to main; only one runs based
# on the DEPLOY_METHOD repository variable:
#   - DEPLOY_METHOD = 'bulk'              → this workflow runs
#   - DEPLOY_METHOD = 'fabric-cicd-bulk'  → deploy-prod-fabric-cicd-bulk.yml runs
#   - DEPLOY_METHOD = 'fabric-cicd' or '' → deploy-prod.yml runs
#   - any other value                     → all skip (safe default)
#
# The `Prod` GitHub Environment should have protection rules configured
# (e.g., required reviewers, branch policy restricting to main only).
#
# The dependent ETL job runs only after this revision's deployment succeeds.

name: Deploy and Run Pipeline - Prod (Bulk API)

on:
  push:
    branches: [main]
    paths: ["data/fabric/**", "data/fabric-dev-bindings.json", "scripts/deploy_fabric_rest_bulk.py", "scripts/fabric_connections.py", "scripts/prepare_fabric_workspace.py", "scripts/pipeline_bindings.py", "scripts/run_fabric_etl.py", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && vars.DEPLOY_METHOD == 'bulk' && 'fabric-deploy-prod' || format('fabric-skipped-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy-bulk:
    name: Deploy via Bulk Import API
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_METHOD == 'bulk'
    uses: ./.github/workflows/reusable-deploy-bulk.yml
    with:
      environment: Prod
    secrets: inherit

  run-etl:
    name: Load, validate, and refresh
    needs: deploy-bulk
    uses: ./.github/workflows/reusable-fabric-etl.yml
    with:
      environment: Prod
      item_name: Patterns_Load_Validate_And_Refresh
      item_type: DataPipeline
      job_type: Pipeline
      run_label: Prod-${{ github.run_id }}
    secrets: inherit
