<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0078d4"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#107c10"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9a6700"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d83b01"/>
    </marker>
  </defs>

  <rect width="920" height="430" rx="10" fill="#faf9f8"/>
  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#201f1e">
    Dev Git Sync + API Deployment to Test and Prod
  </text>

  <rect x="25" y="55" width="165" height="315" rx="10" fill="#eff6fc" stroke="#0078d4" stroke-width="2"/>
  <text x="108" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#004578">Git Repository</text>

  <rect x="43" y="95" width="128" height="38" rx="5" fill="#107c10"/>
  <text x="107" y="119" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">dev branch</text>

  <line x1="107" y1="133" x2="107" y2="181" stroke="#605e5c" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowBlue)"/>
  <text x="119" y="158" font-size="10" fill="#605e5c">PR dev → test</text>

  <rect x="43" y="185" width="128" height="38" rx="5" fill="#ffb900"/>
  <text x="107" y="209" text-anchor="middle" font-size="13" font-weight="600" fill="#201f1e">test branch</text>

  <line x1="107" y1="223" x2="107" y2="271" stroke="#605e5c" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowBlue)"/>
  <text x="119" y="248" font-size="10" fill="#605e5c">PR test → main</text>

  <rect x="43" y="275" width="128" height="38" rx="5" fill="#d83b01"/>
  <text x="107" y="299" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">main branch</text>

  <line x1="171" y1="114" x2="313" y2="114" stroke="#107c10" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="242" y="101" text-anchor="middle" font-size="11" font-weight="600" fill="#107c10">Fabric Git</text>
  <text x="242" y="130" text-anchor="middle" font-size="10" fill="#605e5c">Update from Git</text>

  <rect x="325" y="78" width="190" height="72" rx="9" fill="#e7f5e7" stroke="#107c10" stroke-width="2"/>
  <text x="420" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#0b5a0b">Dev Workspace</text>
  <text x="420" y="126" text-anchor="middle" font-size="11" fill="#0b5a0b">Git-synced development</text>

  <line x1="171" y1="204" x2="253" y2="204" stroke="#9a6700" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <text x="212" y="191" text-anchor="middle" font-size="10" fill="#605e5c">merge</text>

  <rect x="265" y="166" width="185" height="76" rx="9" fill="#e5f1fb" stroke="#0078d4" stroke-width="2"/>
  <text x="358" y="193" text-anchor="middle" font-size="14" font-weight="600" fill="#004578">GitHub Actions</text>
  <text x="358" y="212" text-anchor="middle" font-size="11" fill="#004578">parameterize + API deploy</text>
  <text x="358" y="228" text-anchor="middle" font-size="10" fill="#605e5c">Test environment identity</text>

  <line x1="450" y1="204" x2="510" y2="204" stroke="#9a6700" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

  <rect x="522" y="166" width="170" height="76" rx="9" fill="#fff4ce" stroke="#9a6700" stroke-width="2"/>
  <text x="607" y="193" text-anchor="middle" font-size="14" font-weight="600" fill="#6d4b00">Test Workspace</text>
  <text x="607" y="213" text-anchor="middle" font-size="11" fill="#6d4b00">Not Git-synced</text>
  <text x="607" y="229" text-anchor="middle" font-size="10" fill="#605e5c">pipeline-owned</text>

  <line x1="692" y1="204" x2="746" y2="204" stroke="#107c10" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="758" y="179" width="125" height="50" rx="8" fill="#e7f5e7" stroke="#107c10" stroke-width="1.5"/>
  <text x="821" y="199" text-anchor="middle" font-size="12" font-weight="600" fill="#0b5a0b">Post-deploy</text>
  <text x="821" y="216" text-anchor="middle" font-size="11" fill="#0b5a0b">ETL + validate</text>

  <line x1="171" y1="294" x2="253" y2="294" stroke="#d83b01" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="212" y="281" text-anchor="middle" font-size="10" fill="#605e5c">merge</text>

  <rect x="265" y="256" width="185" height="76" rx="9" fill="#e5f1fb" stroke="#0078d4" stroke-width="2"/>
  <text x="358" y="283" text-anchor="middle" font-size="14" font-weight="600" fill="#004578">GitHub Actions</text>
  <text x="358" y="302" text-anchor="middle" font-size="11" fill="#004578">parameterize + API deploy</text>
  <text x="358" y="318" text-anchor="middle" font-size="10" fill="#605e5c">Prod environment identity</text>

  <line x1="450" y1="294" x2="510" y2="294" stroke="#d83b01" stroke-width="2.5" marker-end="url(#arrowRed)"/>

  <rect x="522" y="256" width="170" height="76" rx="9" fill="#fde7e1" stroke="#d83b01" stroke-width="2"/>
  <text x="607" y="283" text-anchor="middle" font-size="14" font-weight="600" fill="#8e2600">Prod Workspace</text>
  <text x="607" y="303" text-anchor="middle" font-size="11" fill="#8e2600">Not Git-synced</text>
  <text x="607" y="319" text-anchor="middle" font-size="10" fill="#605e5c">pipeline-owned</text>

  <line x1="692" y1="294" x2="746" y2="294" stroke="#107c10" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="758" y="269" width="125" height="50" rx="8" fill="#e7f5e7" stroke="#107c10" stroke-width="1.5"/>
  <text x="821" y="289" text-anchor="middle" font-size="12" font-weight="600" fill="#0b5a0b">Post-deploy</text>
  <text x="821" y="306" text-anchor="middle" font-size="11" fill="#0b5a0b">ETL + validate</text>

  <rect x="215" y="365" width="668" height="42" rx="8" fill="#f3f2f1" stroke="#d2d0ce"/>
  <text x="549" y="391" text-anchor="middle" font-size="13" font-weight="600" fill="#323130">
    Dev is Git-managed. Test and Prod are pipeline-managed. One writer per workspace.
  </text>
</svg>
