  <line x1="510" y1="175" x2="565" y2="175" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== PROD STAGE ==================== -->
  <rect x="810" y="50" width="260" height="230" rx="8" fill="#fce4ec" stroke="#dc3545" stroke-width="1.5"/>
  <text x="940" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#bd2130">ETAPA PROD</text>
  <text x="940" y="88" text-anchor="middle" font-size="9" fill="#555">Trigger: Merge del PR → rama main</text>

