name: Deploy and Run Pipeline - Prod (fabric-cicd Plan)

on:
  push:
    branches: [main]
    paths:
      - "data/fabric/**"
      - "deployment-plans/**"
      - "scripts/deployment_plan.py"
      - "scripts/deploy_fabric_cicd_non_bulk_plan.py"
      - "scripts/fabric_connections.py"
      - "scripts/prepare_fabric_workspace.py"
      - "scripts/pipeline_bindings.py"
      - "scripts/run_fabric_etl.py"
      - "requirements-dev.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && vars.DEPLOY_METHOD == 'fabric-cicd-plan' && 'fabric-deploy-prod' || format('fabric-skipped-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy-fabric-cicd-plan:
    name: Deploy via fabric-cicd Plan
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_METHOD == 'fabric-cicd-plan'
    uses: ./.github/workflows/reusable-deploy-fabric-cicd-plan.yml
    with:
      environment: Prod
      deployment_plan_path: ${{ vars.DEPLOYMENT_PLAN_PATH }}
      item_type_in_scope: '["Lakehouse", "Ontology", "VariableLibrary", "Notebook", "SemanticModel", "Report", "DataAgent", "DataPipeline"]'
    secrets: inherit

  run-etl:
    name: Load, validate, and refresh
    needs: deploy-fabric-cicd-plan
    uses: ./.github/workflows/reusable-fabric-etl.yml
    with:
      environment: Prod
      item_name: Patterns_Load_Validate_And_Refresh
      item_type: DataPipeline
      job_type: Pipeline
      run_label: Prod-${{ github.run_id }}
    secrets: inherit
