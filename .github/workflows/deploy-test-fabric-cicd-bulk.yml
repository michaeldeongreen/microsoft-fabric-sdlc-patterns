# Orchestrator workflow for deploying Fabric items to the Test workspace via
# fabric-cicd strict plan-driven bulk (experimental).
#
# Third deploy method alongside deploy-test.yml (standard fabric-cicd) and
# deploy-test-bulk.yml (raw REST bulk). All fire on push to test; only one runs
# based on the DEPLOY_METHOD repository variable:
#   - DEPLOY_METHOD = 'fabric-cicd-bulk'  → this workflow runs
#   - DEPLOY_METHOD = 'bulk'              → deploy-test-bulk.yml runs
#   - DEPLOY_METHOD = 'fabric-cicd' or '' → deploy-test.yml runs
#   - DEPLOY_METHOD = 'fabric-cicd-plan'  → deploy-test-fabric-cicd-plan.yml runs
#   - any other value                     → all skip (safe default)
#
# Requires DEPLOYMENT_PLAN_PATH. Independent ready groups are combined;
# unexpected standard fallback or failed item outcomes fail deployment.
#
# The dependent ETL job uses the same revision after successful deployment.

name: Deploy and Run Pipeline - Test (fabric-cicd Bulk)

on:
  push:
    branches: [test]
    paths:
      - "data/fabric/**"
      - "deployment-plans/**"
      - ".github/workflows/**"
      - "scripts/deploy_fabric_cicd_bulk.py"
      - "scripts/deployment_plan_bulk.py"
      - "scripts/fabric_connections.py"
      - "scripts/bootstrap_dev_connections.py"
      - "scripts/prepare_fabric_workspace.py"
      - "scripts/pipeline_bindings.py"
      - "scripts/run_fabric_etl.py"
      - "requirements-dev.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/test' && vars.DEPLOY_METHOD == 'fabric-cicd-bulk' && 'fabric-deploy-test' || format('fabric-skipped-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy-fabric-cicd-bulk:
    name: Deploy via fabric-cicd Bulk
    if: github.ref == 'refs/heads/test' && vars.DEPLOY_METHOD == 'fabric-cicd-bulk'
    uses: ./.github/workflows/reusable-deploy-fabric-cicd-bulk.yml
    with:
      environment: Test
      deployment_plan_path: ${{ vars.DEPLOYMENT_PLAN_PATH }}
      item_type_in_scope: '["Lakehouse", "Ontology", "VariableLibrary", "Notebook", "SemanticModel", "Report", "DataAgent", "DataPipeline"]'
    secrets: inherit

  run-etl:
    name: Load, validate, and refresh
    needs: deploy-fabric-cicd-bulk
    uses: ./.github/workflows/reusable-fabric-etl.yml
    with:
      environment: Test
      item_name: Patterns_Load_Validate_And_Refresh
      item_type: DataPipeline
      job_type: Pipeline
      run_label: Test-${{ github.run_id }}
    secrets: inherit
