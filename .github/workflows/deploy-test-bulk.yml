# Orchestrator workflow for deploying Fabric items to the Test workspace via the Bulk Import API.
#
# Alternative to deploy-test.yml. All fire on push to test; only one runs based
# on the DEPLOY_METHOD repository variable:
#   - DEPLOY_METHOD = 'bulk'              → this workflow runs
#   - DEPLOY_METHOD = 'fabric-cicd-bulk'  → deploy-test-fabric-cicd-bulk.yml runs
#   - DEPLOY_METHOD = 'fabric-cicd' or '' → deploy-test.yml runs
#   - any other value                     → all skip (safe default)
#
# The dependent ETL job runs only after this revision's deployment succeeds.

name: Deploy and Run Pipeline - Test (Bulk API)

on:
  push:
    branches: [test]
    paths: ["data/fabric/**", "scripts/deploy_fabric_rest_bulk.py", "scripts/bootstrap_dev_connections.py", "scripts/fabric_connections.py", "scripts/prepare_fabric_workspace.py", "scripts/pipeline_bindings.py", "scripts/run_fabric_etl.py", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/test' && vars.DEPLOY_METHOD == 'bulk' && 'fabric-deploy-test' || format('fabric-skipped-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy-bulk:
    name: Deploy via Bulk Import API
    if: github.ref == 'refs/heads/test' && vars.DEPLOY_METHOD == 'bulk'
    uses: ./.github/workflows/reusable-deploy-bulk.yml
    with:
      environment: Test
    secrets: inherit

  run-etl:
    name: Load, validate, and refresh
    needs: deploy-bulk
    uses: ./.github/workflows/reusable-fabric-etl.yml
    with:
      environment: Test
      item_name: Patterns_Load_Validate_And_Refresh
      item_type: DataPipeline
      job_type: Pipeline
      run_label: Test-${{ github.run_id }}
    secrets: inherit
