# Orchestrator workflow for deploying Fabric items to the Test workspace.
#
# Deploys all supported items via fabric-cicd. The reusable workflow handles
# phased deployment internally (Lakehouse + Ontology first, then everything
# else) to satisfy fabric-cicd dependency resolution.
#
# The dependent ETL job uses this same workflow revision after deployment.

name: Deploy and Run Pipeline - Test (fabric-cicd)

on:
  push:
    branches: [test]
    paths: ["data/fabric/**", "scripts/deploy_fabric_cicd_non_bulk.py", "scripts/fabric_connections.py", "scripts/prepare_fabric_workspace.py", "scripts/pipeline_bindings.py", "scripts/run_fabric_etl.py", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/test' && (vars.DEPLOY_METHOD == '' || vars.DEPLOY_METHOD == 'fabric-cicd') && 'fabric-deploy-test' || format('fabric-skipped-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy-fabric-cicd:
    name: Deploy via fabric-cicd
    # Gated by the DEPLOY_METHOD repository variable. Runs when unset or set to
    # 'fabric-cicd'. Set DEPLOY_METHOD='bulk' (deploy-test-bulk.yml) or
    # 'fabric-cicd-bulk' (deploy-test-fabric-cicd-bulk.yml) to route deployments
    # elsewhere. Any other value disables all deploy workflows.
    if: github.ref == 'refs/heads/test' && (vars.DEPLOY_METHOD == '' || vars.DEPLOY_METHOD == 'fabric-cicd')
    uses: ./.github/workflows/reusable-deploy-fabric-cicd.yml
    with:
      environment: Test
      item_type_in_scope: '["Lakehouse", "Ontology", "VariableLibrary", "Notebook", "SemanticModel", "Report", "DataAgent", "DataPipeline"]'
    secrets: inherit

  run-etl:
    name: Load, validate, and refresh
    needs: deploy-fabric-cicd
    uses: ./.github/workflows/reusable-fabric-etl.yml
    with:
      environment: Test
      item_name: Patterns_Load_Validate_And_Refresh
      item_type: DataPipeline
      job_type: Pipeline
      run_label: Test-${{ github.run_id }}
    secrets: inherit
