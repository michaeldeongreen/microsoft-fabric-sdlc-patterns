  <text x="639" y="341" text-anchor="middle" font-size="10" fill="#333">Validate_Patterns_Data (solo lectura)</text>
  <line x1="742" y1="337" x2="774" y2="337" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="774" y="324" width="276" height="26" rx="4" fill="#fff" stroke="#28a745"/>
