# Manual recovery only; deployment workflows own their dependent ETL job.

name: ETL - Prod

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'fabric-deploy-prod' || format('fabric-skipped-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false

jobs:
  run-etl:
    name: Run ETL
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-fabric-etl.yml
    with:
      environment: Prod
      item_name: Patterns_Load_Validate_And_Refresh
      item_type: DataPipeline
      job_type: Pipeline
      run_label: Prod-${{ github.run_id }}
    secrets: inherit
